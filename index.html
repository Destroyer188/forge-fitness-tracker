<style>

.kbd{border:1px solid var(--border);background:var(--surface2);padding:2px 6px;border-radius:6px;font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:14px}.hero-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:14px}.today-card{min-height:150px}.set-row{display:grid;grid-template-columns:72px 72px 82px 1fr;gap:7px;align-items:end}.set-row input,.set-row select{width:100%}.set-list{display:grid;gap:8px;margin-top:9px}.set-head{font-size:11px;color:var(--muted);display:grid;grid-template-columns:72px 72px 82px 1fr;gap:7px}.set-remove{justify-self:start}

.overlay-info{font-size:12px;color:var(--muted);line-height:1.5}.danger-box{padding:11px;border:1px solid color-mix(in srgb,var(--danger) 45%,var(--border));background:color-mix(in srgb,var(--danger) 8%,var(--surface));border-radius:12px}
.measure-chart{width:100%;height:220px;display:block;background:var(--surface2);border-radius:12px;border:1px solid var(--border)}
.table-wrap{overflow:auto}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal-cell{min-height:70px;border:1px solid var(--border);border-radius:9px;padding:7px;background:var(--surface2)}.cal-cell.header{min-height:auto;background:transparent;border:0;color:var(--muted);font-size:11px;font-weight:800}.cal-cell .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.muted{color:var(--muted)}.small{font-size:12px}.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}.hidden{display:none!important}
.onboarding{min-height:100vh;display:grid;place-items:center;padding:24px}.onboard-card{width:min(640px,100%);background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:24px}.onboard-card .brand{margin-bottom:20px}.help-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.heatmap{display:grid;grid-template-columns:repeat(26,minmax(11px,1fr));gap:4px;overflow:auto;padding-bottom:4px}.heat-col{display:grid;grid-template-rows:repeat(7,11px);gap:4px}.heat-cell{width:11px;height:11px;border-radius:3px;background:var(--surface3);border:1px solid color-mix(in srgb,var(--border) 45%,transparent)}.heat-cell[data-level="1"]{background:color-mix(in srgb,var(--accent2) 28%,var(--surface3))}.heat-cell[data-level="2"]{background:color-mix(in srgb,var(--accent2) 46%,var(--surface3))}.heat-cell[data-level="3"]{background:color-mix(in srgb,var(--accent2) 68%,var(--surface3))}.heat-cell[data-level="4"]{background:var(--accent2)}.heat-legend{display:flex;align-items:center;gap:5px}.heat-legend .heat-cell{width:12px;height:12px}.info-tip{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid var(--border);border-radius:50%;font-size:10px;font-weight:900;color:var(--muted);cursor:help;position:relative;vertical-align:middle;margin-left:4px}.info-tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);width:min(280px,70vw);padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-size:11px;font-weight:500;line-height:1.4;opacity:0;pointer-events:none;transition:opacity .12s;z-index:20}.info-tip:hover::after,.info-tip:focus-visible::after{opacity:1}.backup-reminder{border-left:4px solid var(--warn);background:linear-gradient(135deg,color-mix(in srgb,var(--warn) 8%,var(--surface)),var(--surface))}.substitution-box{margin-top:8px;padding:8px 10px;border:1px dashed color-mix(in srgb,var(--warn) 55%,var(--border));border-radius:10px}.insight{border-left:4px solid var(--accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface))}.flagged{border-left-color:var(--warn)!important}.superset{border:1px solid var(--border);border-radius:14px;padding:10px;background:color-mix(in srgb,var(--accent2) 5%,var(--surface))}.superset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.compare-stage{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:14px;background:var(--surface2);border:1px solid var(--border);isolation:isolate}.compare-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.compare-before{z-index:1}.compare-after{z-index:2;clip-path:inset(0 50% 0 0)}.compare-divider{position:absolute;top:0;bottom:0;left:50%;width:3px;background:var(--text);z-index:4;transform:translateX(-1.5px);pointer-events:none}.compare-range{width:100%;margin-top:10px}.profile-strip{display:flex;align-items:center;gap:7px}.profile-strip select{max-width:180px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);padding:8px 10px}.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}.status-dot.ok{background:var(--success)}

<body>
<div id="root"></div>
<div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
<div id="timer" class="timer" role="status" aria-live="polite" aria-label="Rest timer">
  <div class="timer-inner"><div id="timerTime" class="timer-time">00:00</div><div id="timerMeta" class="timer-meta">Rest</div><div class="inline" style="margin-top:5px"><button class="btn small" id="timerPause">Pause</button><button class="btn small" id="timerReset">Reset</button></div></div>
</div>
<div id="modalBackdrop" class="modal-backdrop" aria-hidden="true"></div>
<script>
'use strict';
const APP_KEY='forgeFitnessV1';
const PROFILE_KEY='forgeProfilesV2';
const MEDIA_DB_NAME='forgeMediaV1';
const MEDIA_STORE='media';
const DAYS=['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const COLORS=['#60a5fa','#6ee7b7','#fbbf24','#fb7185','#a78bfa','#22d3ee','#f97316','#84cc16'];
const CAL_TABS=['dashboard','plan','history','achievements','measurements','coach','settings'];
const GYM_TABS=['today','template','progress','history','utilities','coach','settings'];
let store=loadProfileStore();
let state=loadActiveProfile();
let activeMode=state.ui.mode||'cal';
let calTab=state.ui.calTab||'dashboard';
let gymTab=state.ui.gymTab||'today';
let timer={endTime:null,duration:0,running:false,raf:null,exerciseId:null};
let activeModal=null,modalReturnFocus=null,lastDeleted=null,dragState=null,mediaDB=null,mediaStatus='pending',compareUrls=[];
store.lastSuccessfulExportDate=store.lastSuccessfulExportDate||null;
function blankGymDays(){const out={};DAYS.forEach(d=>out[d]={isRestDay:true,label:'Rest',exercises:[]});return out}
function defaultState(){return {version:2,profile:null,ui:{mode:'cal',calTab:'dashboard',gymTab:'today',theme:'dark'},cal:{exercises:[],selectedDay:null,achievements:{},sessionDates:[],sessionRatings:{},adjustments:[]},gym:{templates:[{id:uid('tpl'),name:'Starter Week',days:blankGymDays()}],activeTemplateId:null,logs:[],unit:'kg',prs:{},adjustments:[],sessionRatings:{},deload:{activeWeek:null,dismissedWeek:null}},measurements:[],coach:{messages:[],dismissedInsightKey:null},settings:{coachProvider:'openai',apiKey:'',enhanced:false,beep:true,vibration:false,unitSystem:'metric',voiceReplies:false,notifications:{enabled:false,gym:true,streak:true,time:'18:00',lastGymNoticeDate:null,lastStreakNoticeDate:null}}}}
// Each profile owns profile, training data, settings, theme, and chat history; the app shell has no mutable user-specific state.
function normalizeProfile(p){const d=defaultState(),out=Object.assign(d,p||{});out.version=2;out.ui=Object.assign(d.ui,p?.ui||{});out.cal=Object.assign(d.cal,p?.cal||{});out.cal.sessionRatings=Object.assign({},d.cal.sessionRatings,p?.cal?.sessionRatings||{});out.gym=Object.assign(d.gym,p?.gym||{});out.gym.sessionRatings=Object.assign({},d.gym.sessionRatings,p?.gym?.sessionRatings||{});out.settings=Object.assign(d.settings,p?.settings||{});out.coach=Object.assign(d.coach,p?.coach||{});out.measurements=Array.isArray(p?.measurements)?p.measurements:[];out.settings.notifications=Object.assign(d.settings.notifications,p?.settings?.notifications||{});out.gym.deload=Object.assign(d.gym.deload,p?.gym?.deload||{});out.gym.adjustments=Array.isArray(p?.gym?.adjustments)?p.gym.adjustments:[];if(!out.gym.templates?.length)out.gym.templates=d.gym.templates;if(!out.gym.activeTemplateId)out.gym.activeTemplateId=out.gym.templates[0]?.id||null;out.gym.templates.forEach(t=>DAYS.forEach(day=>{t.days=t.days||blankGymDays();t.days[day]=Object.assign({isRestDay:true,label:'Rest',exercises:[]},t.days[day]||{});t.days[day].exercises=(t.days[day].exercises||[]).map(e=>Object.assign({supersetGroup:null,sore:false,unit:t.unit||'kg'},e,{unit:e.unit||t.unit||'kg'}))}));out.cal.exercises=(out.cal.exercises||[]).map(e=>Object.assign({sore:false,pairId:null,adjustments:[]},e));out.measurements=(out.measurements||[]).map(m=>Object.assign({measurements:[]},m));return out}
function loadProfileStore(){try{const raw=localStorage.getItem(PROFILE_KEY);if(raw){const parsed=JSON.parse(raw);parsed.profiles=parsed.profiles||{};return parsed}const legacy=localStorage.getItem(APP_KEY);if(legacy){const old=JSON.parse(legacy),id=uid('profile'),migrated=normalizeProfile(old);return {version:2,activeProfileId:id,profiles:{[id]:migrated}}}}catch(e){console.error(e)}return {version:2,activeProfileId:null,profiles:{}}}
function loadActiveProfile(){return store.activeProfileId&&store.profiles[store.activeProfileId]?normalizeProfile(store.profiles[store.activeProfileId]):defaultState()}
function persistStore(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(store));return true}catch(e){console.error(e);toast('Could not save locally. Storage may be full or blocked.','error');return false}}
function saveState(successMsg){try{if(!store.activeProfileId)store.activeProfileId=uid('profile');store.profiles[store.activeProfileId]=normalizeProfile(state);const ok=persistStore();if(ok&&successMsg)toast(successMsg,'success');return ok}catch(e){console.error(e);toast('Could not save locally. Storage may be full or blocked.','error');return false}}
function switchProfile(id){if(!store.profiles[id])return;saveState();store.activeProfileId=id;state=loadActiveProfile();activeMode=state.ui.mode||'cal';calTab=state.ui.calTab||'dashboard';gymTab=state.ui.gymTab||'today';saveState();render()}
function createProfile(name){const id=uid('profile'),p=defaultState();p.profile={name:name||'New Profile',age:18,heightCm:170,createdAt:localDate()};store.profiles[id]=p;store.activeProfileId=id;state=normalizeProfile(p);activeMode='cal';calTab='dashboard';gymTab='today';saveState();render()}
function renameActiveProfile(name){const n=String(name||'').trim();if(!n||!state.profile)return;state.profile.name=n;saveState('Profile renamed');render()}
function uid(p='id'){return p+'_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fromLocalDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dayName(d=new Date()){return DAYS[(d.getDay()+6)%7]}
function prettyDate(s){try{return fromLocalDate(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch{return s}}
function daysSinceLocalDate(s){if(!s)return Infinity;const a=fromLocalDate(s),b=fromLocalDate(localDate());return Math.max(0,Math.floor((b-a)/86400000))}
function backupReminderSuppressed(){try{return sessionStorage.getItem('forgeBackupReminderDismissed')==='1'}catch{return false}}
function dismissBackupReminder(){try{sessionStorage.setItem('forgeBackupReminderDismissed','1')}catch{}render()}

function backupReminderCard(){if(!backupReminderDue())return '';const last=store.lastSuccessfulExportDate?`Last successful backup: ${prettyDate(store.lastSuccessfulExportDate)}.`:'No successful backup has been recorded yet.';return `<div class="card backup-reminder" role="status"><div class="section-head"><div><span class="badge warn">Backup reminder</span><h2 style="margin-top:6px">Keep your Forge data backed up</h2><p>${last} Exporting saves your local training data to a JSON file; progress-photo blobs remain in this browser's IndexedDB.</p></div><button class="btn icon" type="button" data-action="dismissBackupReminder" aria-label="Dismiss backup reminder">×</button></div><div class="inline"><button class="btn primary" data-action="export">Export backup</button><button class="btn" data-action="dismissBackupReminder">Remind me later</button></div></div>`}
function phaseForDay(n){if(n<=10)return 'Foundation';if(n<=20)return 'Build';return 'Peak'}
function toast(msg,type='info',ms=3600){const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toastRegion').append(el);setTimeout(()=>el.remove(),ms)}
function $(sel,root=document){return root.querySelector(sel)}

function renderCalMode(){return `<div class="tab-bar" role="tablist" aria-label="Calisthenics tabs">${CAL_TABS.map(t=>tabButton(t,calTab,labelCal(t))).join('')}</div>${CAL_TABS.map(t=>`<section id="cal-${t}" class="tab-panel" role="tabpanel" aria-hidden="${calTab===t?'false':'true'}" ${calTab===t?'':'hidden'}>${calPanel(t)}</section>`).join('')}`}
function renderGymMode(){return `<div class="tab-bar" role="tablist" aria-label="Gym tabs">${GYM_TABS.map(t=>tabButton(t,gymTab,labelGym(t))).join('')}</div>${GYM_TABS.map(t=>`<section id="gym-${t}" class="tab-panel" role="tabpanel" aria-hidden="${gymTab===t?'false':'true'}" ${gymTab===t?'':'hidden'}>${gymPanel(t)}</section>`).join('')}`}
function tabButton(id,current,label){return `<button class="tab-btn" role="tab" aria-selected="${id===current}" aria-controls="${activeMode==='cal'?'cal':'gym'}-${id}" tabindex="${id===current?'0':'-1'}" data-tab="${id}">${label}</button>`}
function labelCal(t){return ({dashboard:'Dashboard',plan:'30-Day Plan',history:'History',achievements:'Achievements',measurements:'Body Log',coach:'Coach',settings:'Settings'})[t]}
function labelGym(t){return ({today:'Today',template:'Weekly Template',progress:'Progress',history:'History',utilities:'Utilities',coach:'Coach',settings:'Settings'})[t]}
function bindCommon(){$all('[data-tab]').forEach(btn=>{btn.addEventListener('click',()=>switchTab(btn.dataset.tab));btn.addEventListener('keydown',e=>{const tabs=$all('[role=tab]');const i=tabs.indexOf(btn);if(i<0)return;let j=i;if(e.key==='ArrowRight'||e.key==='ArrowDown')j=(i+1)%tabs.length;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')j=(i-1+tabs.length)%tabs.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=tabs.length-1;else return;e.preventDefault();tabs[j].focus();tabs[j].click()})});$all('[data-action]').forEach(b=>b.addEventListener('click',handleAction));$all('button[data-open-modal]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.openModal,b.dataset)));}
function switchTab(t){if(activeMode==='cal'){calTab=t;state.ui.calTab=t}else{gymTab=t;state.ui.gymTab=t}saveState();render()}
function calPanel(t){switch(t){case 'dashboard':return calDashboard();case 'plan':return calPlan();case 'history':return calHistory();case 'achievements':return achievementsPanel('cal');case 'measurements':return measurementsPanel();case 'coach':return coachPanel();case 'settings':return settingsPanel()}return ''}
function gymPanel(t){switch(t){case 'today':return gymToday();case 'template':return gymTemplate();case 'progress':return gymProgress();case 'history':return gymHistory();case 'utilities':return gymUtilities();case 'coach':return coachPanel();case 'settings':return settingsPanel()}return ''}
function localDayIndex(ex){const created=fromLocalDate(ex.planStart||localDate());const now=fromLocalDate(localDate());const diff=Math.floor((now-created)/86400000);return Math.max(1,Math.min(30,diff+1))}
function planDayForExercise(ex,n){return (ex.plan||[]).find(d=>d.day===n)||null}
function calPlan(){return `<div class="section-head"><div><h2>30-Day Plan</h2><p>Each exercise has its own auto-generated block.</p></div><button class="btn primary" data-action="newCalExercise">+ New exercise</button></div><div class="exercise-list">${state.cal.exercises.length?state.cal.exercises.map(renderCalExerciseCard).join(''):`<div class="empty">Create an exercise to generate your first 30-day progression.</div>`}</div>`}
function calcCompletion(ex){const days=ex.plan||[];return Math.round(days.filter(d=>d.completed).length/30*100)}
function calHistory(){const logs=[];state.cal.exercises.forEach(ex=>(ex.plan||[]).forEach(d=>{if(d.log?.date)logs.push({date:d.log.date,name:ex.name,sets:d.log.sets?.length||0,type:d.log.type||d.type})}));logs.sort((a,b)=>b.date.localeCompare(a.date));const dates=[...new Set(logs.map(x=>x.date))];return `<div class="grid grid-2"><div class="card"><div class="section-head"><div><h2>Calendar</h2><p>Calisthenics activity by local date</p></div></div>${calendarHtml(dates,'Cal')}</div><div class="card"><div class="section-head"><div><h2>Recent logs</h2><p>Per-day exercise history</p></div></div>${logs.length?`<div class="table-wrap"><table class="plan-table"><thead><tr><th>Date</th><th>Exercise</th><th>Sets</th><th>Type</th></tr></thead><tbody>${logs.slice(0,40).map(l=>`<tr><td>${prettyDate(l.date)}</td><td>${esc(l.name)}</td><td>${l.sets}</td><td>${esc(l.type)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No calisthenics logs yet.</div>'}</div></div>`}
function calendarHtml(dates,label){const set=new Set(dates);const now=new Date();const first=new Date(now.getFullYear(),now.getMonth(),1);const start=(first.getDay()+6)%7;const count=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();const cells=[];['M','T','W','T','F','S','S'].forEach(x=>cells.push(`<div class="cal-cell header">${x}</div>`));for(let i=0;i<start;i++)cells.push('<div class="cal-cell"></div>');for(let d=1;d<=count;d++){const s=localDate(new Date(now.getFullYear(),now.getMonth(),d));cells.push(`<div class="cal-cell"><strong>${d}</strong><div class="small muted">${set.has(s)?`<span class="dot" style="background:var(--accent)"></span>${esc(label)} logged`:''}</div></div>`)}return `<div class="calendar">${cells.join('')}</div>`}
function achievementsPanel(){const ach=getAchievements();return `<div class="section-head"><div><h2>Achievements</h2><p>Shared milestones across both modes.</p></div></div><div class="grid grid-3">${ach.map(a=>`<div class="card"><div class="badge ${a.unlocked?'success':''}">${a.unlocked?'✓':'○'} ${esc(a.title)}</div><h3 style="margin-top:10px">${esc(a.desc)}</h3><div class="small muted">${a.unlocked?'Unlocked':'Keep training to unlock'}</div></div>`).join('')}</div>`}
function gymHistory(){const logs=state.gym.logs.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="grid grid-2"><div class="card"><h2>Gym calendar</h2>${calendarHtml([...new Set(logs.map(x=>x.date))],'Gym')}</div><div class="card"><h2>Session history</h2>${logs.length?`<div class="table-wrap"><table class="plan-table"><thead><tr><th>Date</th><th>Day</th><th>Exercise</th><th>Sets</th><th>Notes</th></tr></thead><tbody>${logs.slice(0,60).map(l=>`<tr><td>${prettyDate(l.date)}</td><td>${esc(l.dayOfWeek)}</td><td>${esc(l.exerciseName)}</td><td>${l.setsLogged.length}</td><td>${esc(l.notes||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No gym sessions logged yet.</div>'}</div></div>`}
function renderVolumeTable(){const v=weeklyVolume().byMuscle;return Object.keys(v).length?`<div class="table-wrap"><table class="plan-table"><thead><tr><th>Muscle group</th><th>Sets</th></tr></thead><tbody>${Object.entries(v).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No current-week volume yet.</div>'}
function renderGymSuggestions(){const s=state.gym.logs.slice(-10).filter(l=>l.suggestion);return s.length?s.slice(-3).map(x=>`<div class="badge warn">↗ ${esc(x.exerciseName)}: ${esc(x.suggestion)}</div>`).join('<br>'):'<div class="small muted">Overload suggestions appear after a logged exercise reaches the top of its target range at target weight.</div>'}
function infoTip(text,label='Why this?'){return `<span class="info-tip" tabindex="0" role="img" aria-label="${esc(label)} ${esc(text)}" data-tip="${esc(text)}">i</span>`}
function phaseRationale(phase){return ({Foundation:'Build technique and a repeatable base before loading the harder work.',Build:'Gradually increase the training demand while keeping enough reserve to recover and repeat the work.',Peak:'Use the strongest, most specific work of the block to express progress before tapering.',Taper:'Reduce fatigue while keeping movement quality so the final test is not buried under accumulated fatigue.'})[phase]||'This phase sets an appropriate training emphasis for the current part of the block.'}
function rirRationale(rir){if(!rir)return 'RIR is reps in reserve: the approximate number of clean reps you could still perform.';if(String(rir).includes('4'))return 'A high RIR target keeps the work comfortably submaximal for recovery, technique, or lighter practice.';if(String(rir).startsWith('0'))return 'A low RIR target places the work close to failure, so it is used sparingly for hard or test-focused efforts.';return 'This RIR target leaves a small reserve so the session is challenging without turning every set into a max effort.'}
function deloadRationale(){return 'A deload temporarily reduces training stress so accumulated fatigue can come down while you keep practicing the movements.'}
function workoutText(w){if(w==null)return '';if(typeof w==='string')return w;return `${w.sets} × ${w.reps}`}
function planWorkoutReps(ex,type,day){const cur=Number(ex.currentLevel)||0,tgt=Number(ex.targetLevel)||cur;const isStrength=ex.type==='strength';const base=isStrength?Math.max(1,Math.floor(cur*.8)):Math.max(5,Math.floor(cur*.6));const build=isStrength?Math.max(1,Math.floor(cur*1.1)):Math.max(5,Math.floor(cur*.75));const peak=isStrength?Math.max(1,Math.floor(tgt*.7)):Math.max(5,Math.floor(tgt*.5));const gtg=isStrength?Math.max(1,Math.floor(cur*.6)):Math.max(5,Math.floor(cur*.5));if(type==='gtg')return `${3} × ${gtg}`;if(day<=10)return `${3+((day%3===0)?1:0)} × ${base}`;if(day<=20)return `${4} × ${build}`;if(day>=28)return `${2} × ${Math.max(1,Math.floor(peak*.65))}`;return `${4} × ${peak}`}
function generatePlan(ex){const plan=[];const warmByPhase={Foundation:['Joint circles','Scapular push-ups','Easy practice set'],Build:['Joint circles','Movement rehearsal','2 easy ramp sets'],Peak:['Joint prep','Specific warm-up','1-2 crisp singles'],Taper:['Easy joint flow','Technique reps','Slow breathing']};for(let d=1;d<=30;d++){let type='main',workout=planWorkoutReps(ex,'main',d),rir='2-3';if([2,5,8,11,21].includes(d))type='rest',workout=null,rir='4+';if([10,20,30].includes(d))type='test',workout=`Test ~${d===30?100:90}%`,rir='0-2';if(d===14)type='gtg',workout=planWorkoutReps(ex,'gtg',d),rir='4+';if(d===17)type='deload',workout=`2 × ${Math.max(1,Math.floor((Number(ex.currentLevel)||1)*.45))}`,rir='4+';if([12,25].includes(d)&&ex.type==='strength')workout+=' + 2 slow negatives';if(d>=28&&d<30){type='deload';rir='4+'}const phase=d<=10?'Foundation':d<=20?'Build':'Peak';plan.push({day:d,phase,type,workout,accessory:accessoryFor(ex,phase,d),warmup:warmByPhase[d>=28?'Taper':phase],rirTarget:rir,notes:d===17?'Deload: ~40% volume reduction.':d===30?'Final test day.':type==='gtg'?'Grease-the-groove: submaximal crisp reps.':'',completed:false,log:null});}return plan}
function accessoryFor(ex,phase,d){const map={endurance:['Scapular control','Core bracing','Mobility flow'],strength:['Isometric hold','Slow eccentric','Core brace'],custom:['Technique drill','Mobility','Light accessory']};return map[ex.type]?.[d%3]||'Mobility';}
function buildDefaultExercise(name,type,unit,current,target,notes,color){const ex={id:uid('ex'),name,type,unit,currentLevel:Number(current)||0,targetLevel:Number(target)||Number(current)||0,notes,color:color||COLORS[state.cal.exercises.length%COLORS.length],createdAt:localDate(),planStart:localDate(),plan:[],completedMilestones:0,adjustments:[],pairId:null};ex.plan=type==='custom'?buildCustomPlan():generatePlan(ex);return ex}
function buildCustomPlan(){return Array.from({length:30},(_,i)=>({day:i+1,phase:phaseForDay(i+1),type:'main',workout:null,accessory:null,warmup:[],rirTarget:null,notes:'',completed:false,log:null}))}
function modalTitle(t,x='modalTitle'){return `<div class="modal-head"><div><h2 id="${x}">${t}</h2></div><button class="btn icon" type="button" data-close-modal aria-label="Close">×</button></div>`}
function adaptiveRestSeconds(rirTarget,type='',phase=''){const r=String(rirTarget||'').toLowerCase();if(type==='test'||/rir\s*0|rir\s*1|near failure/.test(r))return 180;if(type==='deload'||/taper/.test(String(phase).toLowerCase()))return 90;if(type==='gtg'||/rir\s*4|easy|light/.test(r))return 60;if(/rir\s*2/.test(r))return 150;if(/rir\s*3/.test(r))return 120;return 120}
function adaptiveGymRestSeconds(ex){const range=String(ex?.targetRepRange||'').match(/\d+/g)||[];const top=Number(range[range.length-1]||10);let base=top<=6?180:top<=10?150:top<=15?120:90;const recent=state.gym.logs.filter(l=>l.exerciseId===ex?.id).slice(-3).flatMap(l=>(l.setsLogged||[]).map(s=>Number(s.rir))).filter(Number.isFinite);if(recent.length){const avg=recent.reduce((a,b)=>a+b,0)/recent.length;if(avg<=1)base+=30;else if(avg>=3.5)base-=30}if(ex?.sore)base=Math.max(base,120);return Math.max(45,Math.round(base/15)*15)}
function calSetRow(i,s={}){const ex=state.cal.exercises.find(x=>x.id===state.__modalId),day=planDayForExercise(ex,localDayIndex(ex))||ex?.plan?.[0],rest=s.rest??adaptiveRestSeconds(day?.rirTarget,day?.type,day?.phase);return `<div class="set-row" data-cal-set="${i}" style="margin-top:7px"><input type="number" min="0" class="cal-reps" placeholder="reps" value="${esc(s.reps??'')}" aria-label="Set ${i+1} reps"><select class="cal-rir" aria-label="Set ${i+1} RIR"><option value="">RIR</option>${[0,1,2,3,4,'4+'].map(v=>`<option value="${v}" ${String(s.rir)===String(v)?'selected':''}>${v}</option>`).join('')}</select><input type="number" min="0" class="cal-rest" value="${rest}" aria-label="Rest seconds"><button type="button" class="btn small" data-remove-cal-set>Remove</button></div>`}

='custom'?'Notes / Done':'Done'}</th></tr></thead><tbody>${rows}</tbody></table></div>${ex.type==='custom'?`<div class="overlay-info" style="margin-top:10px">Custom mode uses the manual editor above. Changes save for this exercise's 30-day block when you press Save.</div><div class="modal-footer"><button class="btn" data-close-modal>Close</button><button class="btn primary" id="saveCustomPlan" type="button">Save custom plan</button></div>`:`<div class="modal-footer"><button class="btn" data-close-modal>Close</button></div>`}`}

function applyCalAutoreg(ex){const completedLogs=(ex.plan||[]).filter(d=>d.log).slice(-4);if(completedLogs.length<3)return;const all=completedLogs.flatMap(d=>d.log.rir||[]).filter(x=>x!=null);if(!all.length)return;const avg=all.reduce((a,b)=>a+b,0)/all.length;let delta=0,reason='';if(avg<=0.8){delta=-0.05;reason=`Average RIR is ${avg.toFixed(1)}, trending near failure; upcoming targets nudged down 5%.`}else if(avg>=3.5){delta=0.05;reason=`Average RIR is ${avg.toFixed(1)}, consistently high; upcoming targets nudged up 5%.`}if(!delta)return;ex.targetLevel=Math.max(1,Math.round(ex.targetLevel*(1+delta)));const adj={date:localDate(),name:ex.name,reason};state.cal.adjustments.push(adj);ex.adjustments=(ex.adjustments||[]).concat(adj);toast(reason,'info')}

function getStreak(set){let today=fromLocalDate(localDate());const ts=localDate(today),yd=localDate(new Date(today.getFullYear(),today.getMonth(),today.getDate()-1));if(!set.has(ts)&&!set.has(yd))return 0;let cur=set.has(ts)?today:new Date(today.getFullYear(),today.getMonth(),today.getDate()-1);let count=0;while(set.has(localDate(cur))){count++;cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-1)}return count}

async function exportBackup(){if(!saveState())return;const copy={version:2,activeProfileId:store.activeProfileId,profiles:store.profiles,exportedAt:localDate(),note:'Progress-photo blobs remain in IndexedDB on this browser and are not embedded in JSON.'};const blob=new Blob([JSON.stringify(copy,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`forge-backup-${localDate()}.json`;try{a.click();store.lastSuccessfulExportDate=localDate();persistStore();try{sessionStorage.removeItem('forgeBackupReminderDismissed')}catch{}toast('Backup exported','success')}catch{toast('Backup could not be downloaded.','error')}setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function ruleCoach(msg){const q=msg.toLowerCase();if(/new exercise|add exercise|create.*exercise/.test(q)){openModal('cal');return 'Sure — the real exercise creation form is open. Pick endurance, strength, or custom; creation uses the same app logic as the rest of Forge.'}

if(/schedule.*(monday|tuesday|wednesday|thursday|friday|saturday|sunday)|(monday|tuesday|wednesday|thursday|friday|saturday|sunday).*schedule/.test(q)){const d=(q.match(/monday|tuesday|wednesday|thursday|friday|saturday|sunday/)||[])[0]||dayName();const p=getActiveTemplate().days[d];return p?.isRestDay?`${d[0].toUpperCase()+d.slice(1)} is a rest day in ${getActiveTemplate().name}.`:`${d[0].toUpperCase()+d.slice(1)} is ${p.label||'workout'}: ${(p.exercises||[]).map(e=>e.name).join(', ')||'no exercises yet'}.`}

if(/new gym day|create gym day|add gym exercise/.test(q)){const tpl=getActiveTemplate(),dn=dayName();const label=/push/.test(q)?'Push Day':/pull/.test(q)?'Pull Day':/leg/.test(q)?'Leg Day':'Workout';tpl.days[dn]={isRestDay:false,label,exercises:tpl.days[dn]?.exercises||[]};saveState();state.ui.mode='gym';activeMode='gym';gymTab='template';state.ui.gymTab='template';render();return `${dn[0].toUpperCase()+dn.slice(1)} is now an active ${label.toLowerCase()} in ${tpl.name}. The real weekly-template data was updated; open that tab to add exercises.`}
return 'I can answer questions about your actual plan, progress, streak, gym schedule, or 1RM. Try “what’s my plan today”, “what’s my streak”, “what’s on my gym schedule Wednesday”, or “what’s my squat 1RM”.'}

function weightUnit(){return state.settings.unitSystem==='imperial'?'lb':'kg'}
function kgToLb(v){return Number(v||0)*2.2046226218}
function lbToKg(v){return Number(v||0)/2.2046226218}
function convertWeight(v,from,to){if(v===''||v==null||!Number.isFinite(Number(v)))return v; if(from===to)return Number(v); return to==='lb'?kgToLb(v):lbToKg(v)}
function heightDisplayCm(cm){if(state.settings.unitSystem!=='imperial')return `${Number(cm||0).toFixed(1)} cm`;const totalIn=Number(cm||0)/2.54;const ft=Math.floor(totalIn/12),inch=totalIn-ft*12;return `${ft} ft ${inch.toFixed(1)} in`}
function setGlobalUnitSystem(system){
  const next=system==='imperial'?'imperial':'metric',prev=state.settings.unitSystem||'metric';
  if(prev===next){state.gym.unit=weightUnit();saveState('Unit system saved');render();return}
  const from=prev==='imperial'?'lb':'kg',to=next==='imperial'?'lb':'kg';
  (state.gym.templates||[]).forEach(t=>DAYS.forEach(d=>(t.days?.[d]?.exercises||[]).forEach(e=>{e.targetWeight=Number(convertWeight(e.targetWeight,from,to).toFixed(2));e.unit=to})));
  (state.gym.logs||[]).forEach(l=>(l.setsLogged||[]).forEach(s=>{s.weight=Number(convertWeight(s.weight,from,to).toFixed(2))}));
  Object.values(state.gym.prs||{}).forEach(p=>{p.heaviest=Number(convertWeight(p.heaviest,from,to).toFixed(2));p.best1rm=Number(convertWeight(p.best1rm,from,to).toFixed(2));const nextRep={};Object.entries(p.repAtWeight||{}).forEach(([k,reps])=>{nextRep[Number(convertWeight(Number(k),from,to).toFixed(2))]=reps});p.repAtWeight=nextRep;p.unit=to});
  (state.measurements||[]).forEach(m=>{if(m.unit===from){m.weight=Number(convertWeight(m.weight,from,to).toFixed(2));m.unit=to}else if(m.unit==='kg'||m.unit==='lb'){m.weight=Number(convertWeight(m.weight,m.unit,to).toFixed(2));m.unit=to}});
  state.settings.unitSystem=next;state.gym.unit=to;saveState('Global unit system updated');render();
}

/* ---------- IndexedDB media ---------- */
function openMediaDB(){
  if(mediaDB)return Promise.resolve(mediaDB);
  if(!('indexedDB' in window)){mediaStatus='unavailable';return Promise.resolve(null)}
  return new Promise(resolve=>{
    try{
      const req=indexedDB.open(MEDIA_DB_NAME,1);
      req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(MEDIA_STORE))db.createObjectStore(MEDIA_STORE,{keyPath:'id'})};
      req.onsuccess=()=>{mediaDB=req.result;mediaDB.onversionchange=()=>mediaDB.close();mediaStatus='ok';resolve(mediaDB)};
      req.onerror=()=>{mediaStatus='unavailable';resolve(null)};
      req.onblocked=()=>{mediaStatus='unavailable';resolve(null)};
    }catch{mediaStatus='unavailable';resolve(null)}
  });
}
function mediaPut(blob,meta={}){return openMediaDB().then(db=>{if(!db)throw new Error('IndexedDB unavailable');const id=uid('media');return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put({id,blob,createdAt:Date.now(),...meta});tx.oncomplete=()=>resolve(id);tx.onerror=()=>reject(tx.error||new Error('Media save failed'))})})}
function mediaGet(id){return openMediaDB().then(db=>{if(!db)throw new Error('IndexedDB unavailable');return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,'readonly');const req=tx.objectStore(MEDIA_STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('Media read failed'))})})}
function dataUrlToBlob(dataUrl){const [head,b64]=String(dataUrl).split(',');const mime=(head.match(/data:(.*?);base64/)||[])[1]||'image/jpeg';const bin=atob(b64||'');const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
function compressImageBlob(file,maxW=1200,quality=.75){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=()=>reject(fr.error||new Error('Could not read image'));fr.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Could not decode image'));img.onload=()=>{const scale=Math.min(1,maxW/Math.max(1,img.width)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(blob=>blob?resolve(blob):reject(new Error('Could not compress image')),'image/jpeg',quality)};img.src=fr.result};fr.readAsDataURL(file)})}
async function migrateLegacyMedia(){
  const db=await openMediaDB();if(!db)return false;let changed=false;
  for(const [pid,p] of Object.entries(store.profiles||{})){
    const normalized=normalizeProfile(p);
    for(const ex of normalized.cal.exercises||[])for(const day of ex.plan||[])if(day.log?.photo&&!day.log.photoId){try{const id=await mediaPut(dataUrlToBlob(day.log.photo),{profileId:pid,exerciseId:ex.id,date:day.log.date,type:'photo'});day.log.photoId=id;delete day.log.photo;changed=true}catch{}}
    store.profiles[pid]=normalized;
  }
  if(changed)persistStore();
  return changed;
}

/* ---------- Gym autoregulation, deloads, supersets, soreness ---------- */
function effectiveGymExercise(ex){
  const copy=Object.assign({},ex,{targetSets:Number(ex.targetSets)||1,targetWeight:Number(ex.targetWeight)||0});
  let notes=[];
  if(ex.sore){copy.targetSets=Math.max(1,Math.ceil(copy.targetSets*.7));copy.targetWeight=Number((copy.targetWeight*.9).toFixed(2));notes.push('soreness flag: suggested volume -30% and load -10%')}
  if(getDeloadStatus().active){copy.targetSets=Math.max(1,Math.ceil(copy.targetSets*.7));copy.targetWeight=Number((copy.targetWeight*.9).toFixed(2));notes.push('deload week: suggested volume -30% and load -10%')}
  copy._adjustmentNotes=notes;return copy;
}
function gymAutoregSuggestion(ex){const logs=state.gym.logs.filter(l=>l.exerciseId===ex.id&&l.setsLogged?.some(s=>s.rir!=null)).slice(-4);if(logs.length<3)return null;const r=logs.flatMap(l=>l.setsLogged.map(s=>s.rir)).filter(v=>v!=null);if(!r.length)return null;const avg=r.reduce((a,b)=>a+b,0)/r.length;if(avg<=.8)return {delta:-.05,reason:`Average RIR is ${avg.toFixed(1)} across the last ${logs.length} sessions; upcoming gym targets are suggested 5% lower.`};if(avg>=3.5)return {delta:.05,reason:`Average RIR is ${avg.toFixed(1)} across the last ${logs.length} sessions; upcoming gym targets are suggested 5% higher.`};return null}
function evaluateGymAutoreg(ex){const s=gymAutoregSuggestion(ex);if(!s)return null;const key=ex.id;const existing=state.gym.adjustments.find(a=>a.exerciseId===key&&a.date===localDate());if(existing)return existing;const adj={id:uid('gadj'),exerciseId:key,name:ex.name,date:localDate(),delta:s.delta,reason:s.reason,status:'pending'};state.gym.adjustments.push(adj);return adj}
function applyGymAdjustment(id){const a=state.gym.adjustments.find(x=>x.id===id);if(!a)return;const tpl=getActiveTemplate();let ex=null;for(const d of DAYS){const hit=tpl.days[d].exercises.find(e=>e.id===a.exerciseId);if(hit){ex=hit;break}}if(!ex)return;ex.targetWeight=Number((ex.targetWeight*(1+a.delta)).toFixed(2));a.status='applied';a.appliedDate=localDate();saveState(`Gym target adjusted for ${ex.name}`);render()}
function dismissGymAdjustment(id){const a=state.gym.adjustments.find(x=>x.id===id);if(a)a.status='dismissed';saveState('Gym adjustment dismissed');render()}
function gymCycleWeek(){const dates=(state.gym.logs||[]).map(l=>l.date).sort();if(!dates.length)return 0;const start=fromLocalDate(dates[0]),now=fromLocalDate(localDate());return Math.floor((now-start)/86400000/7)+1}
function gymDeloadMetrics(){const now=fromLocalDate(localDate()),recentStart=localDate(new Date(now.getFullYear(),now.getMonth(),now.getDate()-28)),recent=(state.gym.logs||[]).filter(l=>l.date>=recentStart),rirs=recent.flatMap(l=>(l.setsLogged||[]).map(s=>s.rir)).filter(v=>v!=null),sets=recent.reduce((n,l)=>n+(l.setsLogged||[]).length,0);const avg=rirs.length?rirs.reduce((a,b)=>a+b,0)/rirs.length:null;return {recent,avg,sets,hasData:recent.length>=4}}
function getDeloadStatus(){const week=gymCycleWeek(),m=gymDeloadMetrics(),scheduled=week>0&&week%4===0&&m.hasData;const fatigue=m.avg!=null&&m.avg<=1.5;const volumeHigh=m.sets>=35;const suggested=scheduled&&(fatigue||volumeHigh);return {week,active:state.gym.deload.activeWeek===week,suggested,fatigue,volumeHigh,avg:m.avg,sets:m.sets}}
function startGymDeload(){const d=getDeloadStatus();if(!d.week){toast('Log a few gym sessions first so Forge can place the deload in your training cycle.','info');return}state.gym.deload.activeWeek=d.week;saveState(`Deload week ${d.week} started`);render()}
function endGymDeload(){state.gym.deload.activeWeek=null;saveState('Deload ended');render()}
function substitutionSuggestions(name,mode='gym'){const n=String(name||'').toLowerCase();const rules=mode==='cal'?[[/push[- ]?up|pushup|dip|pike push/i,['Incline push-up','Wall push-up']],[/pull[- ]?up|pullup|chin[- ]?up|chinup/i,['Ring row','Band pulldown']],[/squat|pistol/i,['Box squat','Supported split squat']],[/lunge|split squat/i,['Supported reverse lunge','Glute bridge']],[/plank|hollow/i,['Dead bug','Bird dog']],[/muscle.?up/i,['High pull-up','Jumping transition drill']]]:[[/(bench|chest press|incline press)/i,['Machine chest press','Incline push-up']],[/(overhead|shoulder) press/i,['Machine shoulder press','Landmine press']],[/(squat|leg press)/i,['Goblet squat','Supported split squat']],[/(deadlift|rdl|romanian)/i,['Hip thrust','Cable pull-through']],[/(row|seated row|barbell row)/i,['Chest-supported row','Cable row']],[/(pulldown|pull-up|chin-up)/i,['Assisted pull-up','Single-arm cable pulldown']],[/(curl|biceps)/i,['Hammer curl','Cable curl']],[/(triceps|pushdown)/i,['Cable overhead extension','Close-grip push-up']]];const hit=rules.find(([re])=>re.test(n));return hit?hit[1]:mode==='cal'?['Easier regression of the same movement','Technique-only practice']:['Lighter variation of the same pattern','Cable or machine alternative']}
function substitutionMarkup(ex,mode='gym'){if(!ex?.sore)return '';const items=substitutionSuggestions(ex.name,mode);return `<div class="overlay-info substitution-box"><strong>Try instead:</strong> ${items.map(esc).join(' • ')}<div class="small muted" style="margin-top:3px">These are simple movement-pattern alternatives while the soreness flag is active; clear the flag when the exercise is comfortable again.</div></div>`}
function toggleGymSoreness(day,id){const ex=getActiveTemplate()?.days?.[day]?.exercises?.find(x=>x.id===id);if(!ex)return;ex.sore=!ex.sore;saveState(ex.sore?`${ex.name}: suggestions reduced while flagged sore.`:`${ex.name}: soreness flag cleared.`);render()}
function toggleCalSoreness(id){const ex=state.cal.exercises.find(x=>x.id===id);if(!ex)return;ex.sore=!ex.sore;saveState(ex.sore?`${ex.name}: suggested work reduced while flagged sore.`:`${ex.name}: soreness flag cleared.`);render()}
function effectiveCalDay(ex,d){if(!d)return d;const copy=JSON.parse(JSON.stringify(d));if(ex.sore&&copy.workout){if(Array.isArray(copy.workout.sets))copy.workout.sets=Math.max(1,Math.ceil(copy.workout.sets*.7));if(Number.isFinite(copy.workout.reps))copy.workout.reps=Math.max(1,Math.floor(copy.workout.reps*.9));copy.notes=[copy.notes,'Soreness flag: suggested work reduced by about 30% volume / 10% reps.'].filter(Boolean).join(' ')}return copy}

/* ---------- Activity + proactive insights ---------- */
function activityCounts(){const map={};getCalLoggedDates().forEach(d=>{map[d]=(map[d]||0)+1});(state.gym.logs||[]).forEach(l=>{map[l.date]=(map[l.date]||0)+1});return map}
function heatmapData(weeks=26){const now=fromLocalDate(localDate()),end=new Date(now.getFullYear(),now.getMonth(),now.getDate()),start=new Date(end.getFullYear(),end.getMonth(),end.getDate()-(weeks*7-1));const offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset);const cells=[];const counts=activityCounts();for(let w=0;w<weeks;w++){const col=[];for(let d=0;d<7;d++){const dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7+d),ds=localDate(dt),n=counts[ds]||0;col.push({date:ds,count:n,level:n>=4?4:n>=3?3:n>=2?2:n?1:0})}cells.push(col)}return cells}
function renderActivityHeatmap(){const data=heatmapData();const max=Math.max(0,...Object.values(activityCounts()));const textRows=data[0]?.map((_,d)=>`${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][d]}: `+(data.map(c=>c[d].count).join(', '))).join(' | ');return `<div class="card"><div class="section-head"><div><h2>Activity heatmap</h2><p>Calisthenics + gym activity over the last 26 weeks.</p></div><span class="badge">Peak day count ${max}</span></div><div class="heatmap" role="img" aria-label="26-week activity heatmap. Higher shaded cells mean more recorded activity on that local date.">${data.map((col,w)=>`<div class="heat-col">${col.map(x=>`<div class="heat-cell" data-level="${x.level}" title="${esc(prettyDate(x.date))}: ${x.count} recorded ${x.count===1?'activity':'activities'}" aria-hidden="true"></div>`).join('')}</div>`).join('')}</div><div class="heat-legend small muted" style="margin-top:10px"><span>Less</span>${[0,1,2,3,4].map(n=>`<span class="heat-cell" data-level="${n}" aria-hidden="true"></span>`).join('')}<span>More</span></div><details style="margin-top:10px"><summary>Text alternative</summary><p class="small muted">${esc(textRows)}</p></details></div>`}
function getProactiveInsight(){
  const now=fromLocalDate(localDate());
  const calCandidate=(state.cal.exercises||[]).map(ex=>{const dates=[...(ex.plan||[])].filter(d=>d.log?.date).map(d=>d.log.date).sort();if(!dates.length)return null;const last=fromLocalDate(dates.at(-1));const gap=Math.floor((now-last)/86400000);return gap>=8?{key:`lapse:${ex.id}:${dates.at(-1)}`,priority:3,title:`${ex.name} has been quiet`,body:`No logged session for ${gap} days. Review whether you want to resume, adjust, or retire this exercise.`,action:'openPlan',id:ex.id}:null}).filter(Boolean);
  const rising=(state.gym.logs||[]).map(l=>{const rir=(l.setsLogged||[]).map(s=>s.rir).filter(v=>v!=null);return rir.length?{date:l.date,id:l.exerciseId,name:l.exerciseName,avg:rir.reduce((a,b)=>a+b,0)/rir.length}:null}).filter(Boolean);
  const byEx={};rising.forEach(x=>(byEx[x.id]??=[]).push(x));const gymCandidate=[];Object.values(byEx).forEach(rows=>{const r=rows.slice(-3);if(r.length===3&&r[2].avg>r[1].avg&&r[1].avg>=r[0].avg+.4)gymCandidate.push({key:`rir:${r[0].id}:${r.at(-1).date}`,priority:2,title:`RIR is rising on ${r.at(-1).name}`,body:`The last three logged averages moved upward. Check whether your current targets are still challenging enough before adding load.`,action:'openGymProgress',id:r.at(-1).id})});
  const close=(state.cal.exercises||[]).map(ex=>({ex,p:calcCompletion(ex)})).filter(x=>x.p>=80&&x.p<100).sort((a,b)=>b.p-a.p)[0];if(close)gymCandidate.push({key:`close:${close.ex.id}:${close.p}`,priority:1,title:`${close.ex.name} is ${close.p}% through its block`,body:'The current 30-day plan is nearing completion. A next block can use your latest best set as the new baseline.',action:'openPlan',id:close.ex.id});
  const d=getDeloadStatus();if(d.suggested&&!d.active)gymCandidate.push({key:`deload:${d.week}`,priority:4,title:`Deload week ${d.week} is suggested`,body:`Forge logged ${d.sets} sets in the recent 28-day window${d.avg!=null?` with average RIR ${d.avg.toFixed(1)}`:''}. Consider starting the explicit reduced-load deload week.`,action:'startDeload'});
  return [...calCandidate,...gymCandidate].sort((a,b)=>b.priority-a.priority)[0]||null;
}
function proactiveInsightCard(){const i=getProactiveInsight();if(!i||state.coach.dismissedInsightKey===i.key)return '';return `<div class="card insight"><div class="section-head"><div><span class="badge">Coach insight</span><h2 style="margin-top:6px">${esc(i.title)}</h2><p>${esc(i.body)}</p></div><button class="btn small" data-action="dismissInsight" data-id="${esc(i.key)}" aria-label="Dismiss coach insight">Dismiss</button></div><div class="inline">${i.action==='openPlan'?`<button class="btn small primary" data-action="viewPlan" data-id="${i.id}">Open plan</button>`:''}${i.action==='openGymProgress'?`<button class="btn small primary" data-action="gymProgressTab">Open gym progress</button>`:''}${i.action==='startDeload'?`<button class="btn small primary" data-action="startDeload">Start deload</button>`:''}</div></div>`}
function dismissInsight(key){state.coach.dismissedInsightKey=key;saveState();render()}

/* ---------- Measurements ---------- */
function measurementMetricOptions(){const names=new Set(['weight']);(state.measurements||[]).forEach(m=>Object.keys(m.measurements||{}).forEach(k=>names.add(k)));return [...names]}
function measurementValue(m,key){if(key==='weight')return typeof m.weight==='number'?m.weight:null;return typeof m.measurements?.[key]==='number'?m.measurements[key]:null}
function measurementUnit(key){if(key==='weight')return weightUnit();return 'user-defined'}
function hasSession(mode,date=localDate()){if(mode==='cal')return (state.cal.exercises||[]).some(ex=>(ex.plan||[]).some(d=>d.log?.date===date));return (state.gym.logs||[]).some(l=>l.date===date)}
function getSessionRating(mode,date=localDate()){return state[mode]?.sessionRatings?.[date]||null}
function sessionCheckinCard(mode,date=localDate()){if(!hasSession(mode,date))return '';const r=getSessionRating(mode,date);return `<div class="card" style="margin-top:12px"><div class="section-head"><div><h2>Session check-in</h2><p>One quick 1–5 rating for how the whole session felt, separate from per-set RIR.</p></div><button class="btn ${r?'':'primary'}" data-action="sessionCheckin" data-mode="${mode}">${r?`Edit rating (${r.rating}/5)`:'Rate this session'}</button></div>${r?`<div class="badge success">${r.rating}/5 • ${esc(r.label||sessionRatingLabel(r.rating))}</div>${r.note?`<p class="small muted" style="margin-top:7px">${esc(r.note)}</p>`:''}`:'<div class="small muted">This captures overall session feel/fatigue, which RIR does not.</div>'}</div>`}
function sessionRatingLabel(n){return ({1:'Very rough',2:'Hard',3:'Okay',4:'Good',5:'Great'})[Number(n)]||'Rated'}
function sessionCheckinModal(data){const mode=data.mode==='gym'?'gym':'cal',date=data.date||localDate(),r=getSessionRating(mode,date);return `${modalTitle(`Session check-in • ${mode==='gym'?'Gym':'Calisthenics'}`)}<form id="sessionCheckinForm"><input type="hidden" id="sessionMode" value="${mode}"><input type="hidden" id="sessionDate" value="${date}"><fieldset style="border:0;padding:0;margin:0"><legend class="small muted">How did the overall session feel?</legend><div class="inline" role="radiogroup" aria-label="Session feel from one to five" style="margin-top:8px">${[1,2,3,4,5].map(n=>`<label class="badge" style="cursor:pointer"><input type="radio" name="sessionRating" value="${n}" ${Number(r?.rating)===n?'checked':''}> ${n} — ${sessionRatingLabel(n)}</label>`).join('')}</div></fieldset><div class="field" style="margin-top:12px"><label for="sessionNote">Optional note</label><textarea id="sessionNote" placeholder="Energy, focus, overall fatigue…">${esc(r?.note||'')}</textarea></div><div class="modal-footer"><button class="btn" type="button" data-close-modal>Cancel</button><button class="btn primary" type="submit">Save check-in</button></div></form>`}
function saveSessionCheckin(e){e.preventDefault();const mode=$('#sessionMode').value==='gym'?'gym':'cal',date=$('#sessionDate').value||localDate(),rating=Number(document.querySelector('input[name="sessionRating"]:checked')?.value);if(!Number.isInteger(rating)||rating<1||rating>5){toast('Choose a session rating from 1 to 5.','error');return}state[mode].sessionRatings=state[mode].sessionRatings||{};state[mode].sessionRatings[date]={rating,label:sessionRatingLabel(rating),note:$('#sessionNote').value.trim(),updatedAt:Date.now()};saveState('Session check-in saved');closeModal();render()}
function combinedSessionTrend(){const ratings={};['cal','gym'].forEach(mode=>Object.entries(state[mode]?.sessionRatings||{}).forEach(([d,v])=>{ratings[d]=(ratings[d]||[]).concat(v.rating)}));const rir={};(state.cal.exercises||[]).forEach(ex=>(ex.plan||[]).forEach(d=>{if(!d.log?.date)return;const vals=(d.log.rir||[]).filter(v=>v!=null);if(vals.length)(rir[d.log.date]??=[]).push(...vals)}));(state.gym.logs||[]).forEach(l=>{const vals=(l.setsLogged||[]).map(s=>s.rir).filter(v=>v!=null);if(vals.length)(rir[l.date]??=[]).push(...vals)});const dates=[...new Set([...Object.keys(ratings),...Object.keys(rir)])].sort().slice(-16);return dates.map(date=>({date,session:ratings[date]?.length?ratings[date].reduce((a,b)=>a+b,0)/ratings[date].length:null,rir:rir[date]?.length?rir[date].reduce((a,b)=>a+b,0)/rir[date].length:null})).filter(x=>x.session!=null||x.rir!=null)}
function renderSessionTrendCard(){const rows=combinedSessionTrend();if(!rows.length)return `<div class="card"><h2>Session feel & RIR trend</h2><div class="empty">Log a session and add a check-in plus RIR values to see the trend.</div></div>`;const alt=rows.map(r=>`${prettyDate(r.date)}: session ${r.session==null?'—':r.session.toFixed(1)}/5; RIR ${r.rir==null?'—':r.rir.toFixed(1)}`).join('; ');return `<div class="card"><div class="section-head"><div><h2>Session feel & RIR trend</h2><p>Session rating and average RIR over recent logged dates.</p></div><span class="badge">Higher RIR = more reps in reserve</span></div><canvas id="sessionTrendChart" class="measure-chart" role="img" aria-label="Trend chart comparing overall session rating and average RIR over recent sessions"></canvas><div class="inline small muted" style="margin-top:7px"><span>Session feel: 1–5</span><span>RIR: 0–4+</span></div><details style="margin-top:8px"><summary>Text alternative</summary><p class="small muted">${esc(alt)}</p></details></div>`}
function populateSessionTrendChart(){const c=$('#sessionTrendChart');if(!c)return;const rows=combinedSessionTrend(),rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(320,rect.width*dpr);c.height=Math.max(180,rect.height*dpr);const ctx=c.getContext('2d'),cs=getComputedStyle(document.documentElement),text=cs.getPropertyValue('--text').trim(),border=cs.getPropertyValue('--border').trim(),accent=cs.getPropertyValue('--accent').trim(),accent2=cs.getPropertyValue('--accent2').trim();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);ctx.font='12px system-ui';ctx.fillStyle=text;if(rows.length<2){ctx.fillText('Add more logged sessions to draw a trend.',24,rect.height/2);return}const pad=28,w=rect.width,h=rect.height;ctx.strokeStyle=border;ctx.beginPath();ctx.moveTo(pad,h-pad);ctx.lineTo(w-pad,h-pad);ctx.stroke();const draw=(key,maxVal,color)=>{ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();rows.forEach((r,i)=>{const v=r[key];if(v==null)return;const x=pad+i*(w-2*pad)/(rows.length-1),y=h-pad-(v/maxVal)*(h-2*pad);if(i===0||!rows.slice(0,i).some(z=>z[key]!=null))ctx.moveTo(x,y);else{let prev=-1;for(let j=i-1;j>=0;j--)if(rows[j][key]!=null){prev=j;break}if(prev<0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}});ctx.stroke()};draw('session',5,accent);draw('rir',4,accent2);ctx.fillStyle=text;ctx.fillText('5',8,18);ctx.fillText('0',8,h-pad+4);ctx.fillText('Newest',w-50,h-8)}
function measurementsPanel(){const list=(state.measurements||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)),options=measurementMetricOptions(),selected=state.ui.measurementMetric||options[0]||'weight';state.ui.measurementMetric=options.includes(selected)?selected:options[0]||'weight';const rows=list.map(x=>({x,v:measurementValue(x,state.ui.measurementMetric)})).filter(o=>o.v!=null);return `<div class="grid grid-2"><div class="card"><div class="section-head"><div><h2>Body Measurements</h2><p>Kept separate from calisthenics and lift-progress data.</p></div><button class="btn primary" data-action="addMeasurement">+ Entry</button></div><div class="field"><label for="measureMetric">Trend metric</label><select id="measureMetric">${options.map(k=>`<option value="${esc(k)}" ${k===state.ui.measurementMetric?'selected':''}>${esc(k==='weight'?'Weight':k)}</option>`).join('')}</select></div>${rows.length?`<canvas id="measureChart" class="measure-chart" role="img" aria-label="Body measurement trend chart for ${esc(state.ui.measurementMetric)}"></canvas><div class="small muted" style="margin-top:7px">Text alternative: ${esc(rows.map(o=>`${prettyDate(o.x.date)} ${o.v} ${measurementUnit(state.ui.measurementMetric)}`).join('; '))}</div>`:'<div class="empty" style="margin-top:10px">Add at least one entry with this metric to see its trend.</div>'}</div><div class="card"><h2>Entries</h2>${list.length?`<div class="table-wrap"><table class="plan-table"><thead><tr><th>Date</th><th>Weight</th><th>Named measurements</th><th>Notes</th><th></th></tr></thead><tbody>${list.slice().reverse().map(x=>`<tr><td>${prettyDate(x.date)}</td><td>${x.weight==null?'—':`${esc(Number(x.weight).toFixed(2))} ${weightUnit()}`}</td><td>${Object.entries(x.measurements||{}).map(([k,v])=>`${esc(k)}: ${esc(v)}`).join('<br>')||'—'}</td><td>${esc(x.notes||'')}</td><td><button class="btn small danger" data-action="deleteMeasurement" data-id="${x.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nothing recorded.</div>'}</div></div>`}
function measurementModal(){return `${modalTitle('Body measurement entry')}<form id="measurementForm" class="form-grid"><div class="field"><label for="measDate">Date</label><input id="measDate" type="date" value="${localDate()}"></div><div class="field"><label for="measWeight">Body weight (${weightUnit()})</label><input id="measWeight" type="number" min="0" step="0.1" placeholder="Optional"></div><div class="field full"><div class="section-head"><div><strong>Named measurements</strong><div class="small muted">Use any names you want, such as waist or arm circumference. Units are stored with the label/value you enter and are not auto-converted.</div></div><button class="btn small" id="addMeasurementRow" type="button">+ Measurement</button></div><div id="measurementRows" class="set-list"><div class="set-row measurement-row" style="grid-template-columns:1fr 110px auto"><input class="measure-name" placeholder="Waist"><input class="measure-value" type="number" step="0.1" placeholder="Value"><button class="btn small" type="button" data-action="removeMeasurementRow">Remove</button></div></div></div><div class="field full"><label for="measNotes">Notes</label><textarea id="measNotes" placeholder="Optional context"></textarea></div><div class="modal-footer field full"><button class="btn" type="button" data-close-modal>Cancel</button><button class="btn primary" type="submit">Save entry</button></div></form>`}
function bindMeasurementModal(){let idx=1;$('#addMeasurementRow')?.addEventListener('click',()=>{$('#measurementRows').insertAdjacentHTML('beforeend',`<div class="set-row measurement-row" style="grid-template-columns:1fr 110px auto"><input class="measure-name" placeholder="Measurement ${idx++}"><input class="measure-value" type="number" step="0.1" placeholder="Value"><button class="btn small" type="button" data-action="removeMeasurementRow">Remove</button></div>`);bindModalActions()})}
function saveMeasurement(e){e.preventDefault();const items={};$all('.measurement-row').forEach(r=>{const name=$('.measure-name',r)?.value.trim(),v=Number($('.measure-value',r)?.value);if(name&&Number.isFinite(v))items[name]=v});const w=$('#measWeight').value===''?null:Number($('#measWeight').value);if(w==null&&!Object.keys(items).length){toast('Add a weight or at least one named measurement.','error');return}state.measurements.push({id:uid('m'),date:$('#measDate').value||localDate(),weight:w,unit:weightUnit(),measurements:items,notes:$('#measNotes').value.trim()});state.measurements.sort((a,b)=>a.date.localeCompare(b.date));saveState('Measurement saved');closeModal();render()}
function populateMeasureChart(){const c=$('#measureChart');if(!c)return;const key=state.ui.measurementMetric||'weight',vals=(state.measurements||[]).map(m=>({date:m.date,v:measurementValue(m,key)})).filter(x=>typeof x.v==='number');const rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(280,rect.width*dpr);c.height=Math.max(180,rect.height*dpr);const ctx=c.getContext('2d');const cs=getComputedStyle(document.documentElement),text=cs.getPropertyValue('--text').trim(),border=cs.getPropertyValue('--border').trim(),accent=cs.getPropertyValue('--accent').trim();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);ctx.fillStyle=text;ctx.font='12px system-ui';if(vals.length<2){ctx.fillText('Add at least two entries to draw a trend.',24,rect.height/2);return}const min=Math.min(...vals.map(x=>x.v)),max=Math.max(...vals.map(x=>x.v)),span=max-min||1,pad=28,w=rect.width,h=rect.height;ctx.strokeStyle=border;ctx.beginPath();ctx.moveTo(pad,h-pad);ctx.lineTo(w-pad,h-pad);ctx.stroke();ctx.strokeStyle=accent;ctx.lineWidth=2;ctx.beginPath();vals.forEach((p,i)=>{const x=pad+i*(w-2*pad)/(vals.length-1),y=h-pad-(p.v-min)/span*(h-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle=text;ctx.fillText(String(max),pad,15);ctx.fillText(String(min),pad,h-8)}

/* ---------- Voice Coach ---------- */
function speechInputSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function startCoachSpeechRecognition(){if(!speechInputSupported()||speechRecognitionActive)return;const C=window.SpeechRecognition||window.webkitSpeechRecognition;try{const rec=new C();rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=false;speechRecognitionActive=true;const btn=$('#coachMic');if(btn)btn.setAttribute('aria-pressed','true');rec.onresult=e=>{const text=[...e.results].map(r=>r[0].transcript).join('');const input=$('#chatInput');if(input)input.value=text};rec.onerror=()=>{};rec.onend=()=>{speechRecognitionActive=false;const b=$('#coachMic');if(b)b.setAttribute('aria-pressed','false')};rec.start()}catch{speechRecognitionActive=false}}
function speakCoach(text){if(!state.settings.voiceReplies||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[`*_#]/g,''));u.rate=.98;speechSynthesis.speak(u)}catch{}}
function coachPanel(){if(!state.coach.messages.length)state.coach.messages=[{role:'bot',text:`Hey ${state.profile?.name||'there'} — I can read your actual Forge data. Try “what's my plan today”, “what's my streak”, “what's on my gym schedule Wednesday”, “what's my squat 1RM”, or say “new exercise”.`}];const mic=speechInputSupported();return `<div class="card chat"><div class="section-head"><div><h2>Coach</h2><p>${state.settings.enhanced&&state.settings.apiKey?'Enhanced Coach enabled':'Rule-based coach — no API key needed'}</p></div><div class="inline"><label class="checkbox"><input id="coachVoiceToggle" type="checkbox" ${state.settings.voiceReplies?'checked':''}> Read replies aloud</label><span class="badge">${mic?'Voice input ready':'Text only on this browser'}</span></div></div><div id="chatMessages" class="chat-messages" aria-live="polite">${state.coach.messages.map(m=>`<div class="msg ${m.role==='user'?'user':'bot'}">${esc(m.text).replace(/\n/g,'<br>')}</div>`).join('')}</div><form id="chatForm" class="chat-form"><label class="sr-only" for="chatInput">Message Coach</label><input id="chatInput" autocomplete="off" placeholder="Ask about your plan, progress, or say “log 10 reps RIR 2”"><button class="btn" type="button" id="coachMic" ${mic?'':'disabled'} aria-label="Speak to Coach" aria-pressed="false">🎙</button><button class="btn primary" type="submit">Send</button></form></div>`}
function bindCoach(){const f=$('#chatForm');if(f&&!f.dataset.bound){f.dataset.bound='1';f.addEventListener('submit',async e=>{e.preventDefault();const input=$('#chatInput'),msg=input.value.trim();if(!msg)return;state.coach.messages.push({role:'user',text:msg});input.value='';saveState();render();if(state.settings.enhanced&&state.settings.apiKey){const enhanced=await callEnhancedCoach(msg);state.coach.messages.push({role:'bot',text:enhanced});speakCoach(enhanced);saveState();render()}else{const reply=ruleCoach(msg);state.coach.messages.push({role:'bot',text:reply});speakCoach(reply);saveState();render()}})}const mic=$('#coachMic');if(mic&&!mic.dataset.bound){mic.dataset.bound='1';mic.addEventListener('click',startCoachSpeechRecognition)}const vt=$('#coachVoiceToggle');if(vt&&!vt.dataset.bound){vt.dataset.bound='1';vt.addEventListener('change',e=>{state.settings.voiceReplies=e.target.checked;saveState('Coach voice setting saved')})}}

/* ---------- Notifications / reminders ---------- */
async function requestNotificationPermission(){if(!('Notification' in window)){toast('Notifications are not supported by this browser.','error');return}try{if(Notification.permission==='denied'){state.settings.notifications.enabled=false;saveState();toast('Notifications are blocked by the browser; no further requests will be made.','error');render();return}const p=Notification.permission==='granted'?'granted':await Notification.requestPermission();if(p==='granted'){state.settings.notifications.enabled=true;saveState('Workout reminders enabled','success')}else{state.settings.notifications.enabled=false;saveState();toast('Notification permission was not granted. Forge will stay quiet.','info')}render()}catch{toast('Notifications could not be enabled in this browser/context. Forge will stay quiet.','error')}}
function localTimeMinutes(){const d=new Date();return d.getHours()*60+d.getMinutes()}
function checkWorkoutReminders(){const n=state.settings.notifications;if(!n?.enabled||typeof Notification==='undefined'||Notification.permission!=='granted')return;const [hh,mm]=(n.time||'18:00').split(':').map(Number);if(localTimeMinutes()<hh*60+mm)return;const today=localDate();const plan=getActiveTemplate()?.days?.[dayName()];if(n.gym&&!plan?.isRestDay&&!state.gym.logs.some(l=>l.date===today)&&n.lastGymNoticeDate!==today){try{new Notification('Forge workout reminder',{body:`${plan.label||'Gym session'} is scheduled today.`});n.lastGymNoticeDate=today;saveState()}catch{}}
  const combined=getStreak(new Set([...getCalLoggedDates(),...getGymLoggedDates()]));if(n.streak&&combined>0&&!getCalLoggedDates().has(today)&&!getGymLoggedDates().has(today)&&n.lastStreakNoticeDate!==today){try{new Notification('Forge streak reminder',{body:'Your current training streak is still alive — a short logged activity today will keep it going.'});n.lastStreakNoticeDate=today;saveState()}catch{}}
}
function bindNotificationSettings(){const u=$('#unitSystemSelect');if(u)u.addEventListener('change',e=>setGlobalUnitSystem(e.target.value));const vr=$('#coachVoiceToggleSetting');if(vr)vr.addEventListener('change',e=>{state.settings.voiceReplies=e.target.checked;saveState()});const time=$('#reminderTime');if(time)time.addEventListener('change',e=>{state.settings.notifications.time=e.target.value;saveState()});const gym=$('#gymReminderToggle');if(gym)gym.addEventListener('change',e=>{state.settings.notifications.gym=e.target.checked;saveState()});const streak=$('#streakReminderToggle');if(streak)streak.addEventListener('change',e=>{state.settings.notifications.streak=e.target.checked;saveState()})}

function renderCalExerciseCard(ex){const p=calcCompletion(ex),photoCount=(ex.plan||[]).filter(d=>d.log?.photoId).length,flag=ex.sore;return `<article class="exercise-card ${flag?'flagged':''}" style="--card-accent:${esc(ex.color||COLORS[0])}"><div class="section-head"><div><h3>${esc(ex.name)}</h3><div class="exercise-meta"><span class="badge">${esc(ex.type)}</span><span class="badge">Current ${esc(ex.currentLevel)} ${esc(ex.unit)}</span><span class="badge">Target ${esc(ex.targetLevel)} ${esc(ex.unit)}</span>${flag?'<span class="badge warn">⚠ Soreness flagged</span>':''}</div></div><div style="min-width:160px"><div class="small muted">${p}% complete</div><div class="progress"><span style="width:${p}%"></span></div></div></div><div class="small muted">${esc(ex.notes||'No notes')}</div>${flag?'<div class="overlay-info" style="margin-top:7px">Suggested workout volume/reps are automatically reduced while this flag is active.</div>'+substitutionMarkup(ex,'cal'):''}<div class="exercise-actions"><button class="btn small" data-action="viewPlan" data-id="${ex.id}">Open 30 days</button><button class="btn small" data-action="editCal" data-id="${ex.id}">Edit</button><button class="btn small" data-action="toggleCalSoreness" data-id="${ex.id}">${flag?'Clear soreness':'Flag soreness'}</button>${photoCount>=2?`<button class="btn small" data-action="photoCompare" data-id="${ex.id}">Compare photos (${photoCount})</button>`:''}<button class="btn small danger" data-action="deleteCal" data-id="${ex.id}">Delete</button><button class="btn small" data-action="pairCal" data-id="${ex.id}">${ex.pairId?'Unpair':'Pair'}</button>${p>=100?`<button class="btn small primary" data-action="nextBlock" data-id="${ex.id}">Next block</button>`:''}</div></article>`}
function gymTemplate(){const tpl=getActiveTemplate(),libs=templateLibrary();return `<div class="section-head"><div><h2>Weekly Template</h2><p>Build multiple weekly splits, or start from a built-in library template.</p></div><div class="inline"><select id="templateSelect" aria-label="Active template">${state.gym.templates.map(t=>`<option value="${t.id}" ${t.id===tpl.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><button class="btn primary" data-action="newTemplate">+ Scratch</button><button class="btn small" data-action="editTemplateMeta">Rename</button><button class="btn small" data-action="exportICS">Download .ics</button></div></div><div class="grid grid-2" style="margin-bottom:14px">${libs.map(l=>`<article class="card"><div class="section-head"><div><h3>${esc(l.name)}</h3><p>${esc(l.desc)}</p></div><button class="btn small primary" data-action="importGymTemplate" data-id="${l.id}">Import</button></div><div class="small muted">${DAYS.filter(d=>!l.days[d].isRestDay).map(d=>`${d[0].toUpperCase()+d.slice(1)}: ${l.days[d].label}`).join(' • ')}</div></article>`).join('')}</div><div class="day-list">${DAYS.map(d=>gymDayEditor(tpl,d)).join('')}</div>`}

function comparisonExerciseOptions(){const out=[];(state.cal.exercises||[]).forEach(ex=>out.push({id:`cal:${ex.id}`,label:`Cal • ${ex.name}`}));const seen=new Set();(state.gym.templates||[]).forEach(t=>{DAYS.forEach(d=>{(t.days?.[d]?.exercises||[]).forEach(ex=>{if(seen.has(ex.id))return;seen.add(ex.id);out.push({id:`gym:${ex.id}`,label:`Gym • ${ex.name}`})})})});return out}

function renderProgressComparison(){const opts=comparisonExerciseOptions();if(!opts.length)return `<div class="card"><h2>Progress comparison</h2><div class="empty">Add at least two exercises to compare their relative progress.</div></div>`;const a=state.ui.compareA&&opts.some(o=>o.id===state.ui.compareA)?state.ui.compareA:opts[0].id,b=state.ui.compareB&&opts.some(o=>o.id===state.ui.compareB)?state.ui.compareB:(opts[1]?.id||opts[0].id);state.ui.compareA=a;state.ui.compareB=b;return `<div class="card"><div class="section-head"><div><h2>Progress comparison</h2><p>Compare two exercise curves after normalizing each exercise's first logged point to 100%.</p></div><span class="badge">Relative improvement</span></div><div class="form-grid" style="margin-bottom:10px"><div class="field"><label for="compareExerciseA">Exercise A</label><select id="compareExerciseA">${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===a?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div><div class="field"><label for="compareExerciseB">Exercise B</label><select id="compareExerciseB">${opts.map(o=>`<option value="${esc(o.id)}" ${o.id===b?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div></div><canvas id="progressCompareChart" class="measure-chart" role="img" aria-label="Relative progress comparison for two selected exercises"></canvas><div id="progressCompareLegend" class="inline small muted" style="margin-top:7px"></div><details style="margin-top:8px"><summary>How this comparison works</summary><p class="small muted">Calisthenics uses the best logged reps for each date. Gym uses the best estimated 1RM for each date. Each series starts at 100%, so the chart compares the rate of change rather than raw units.</p></details></div>`}
function drawProgressComparison(){const c=$('#progressCompareChart');if(!c)return;const a=progressSeries($('#compareExerciseA')?.value),b=progressSeries($('#compareExerciseB')?.value);const rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.max(320,rect.width*dpr);c.height=Math.max(200,rect.height*dpr);const ctx=c.getContext('2d'),cs=getComputedStyle(document.documentElement),text=cs.getPropertyValue('--text').trim(),border=cs.getPropertyValue('--border').trim(),accent=cs.getPropertyValue('--accent').trim(),accent2=cs.getPropertyValue('--accent2').trim();ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);ctx.font='12px system-ui';ctx.fillStyle=text;if(!a&&!b){ctx.fillText('Choose logged exercises to compare.',24,rect.height/2);return}const pad=32,w=rect.width,h=rect.height,sets=[a,b].filter(Boolean),series=sets.map((ser)=>({ser,vals:ser.rows.map((r,i)=>({x:i,y:ser.rows[0].value?r.value/ser.rows[0].value*100:100,date:r.date}))}));const min=Math.min(50,...series.flatMap(s=>s.vals.map(v=>v.y))),max=Math.max(110,...series.flatMap(s=>s.vals.map(v=>v.y))),span=max-min||1;ctx.strokeStyle=border;ctx.beginPath();ctx.moveTo(pad,h-pad);ctx.lineTo(w-pad,h-pad);ctx.stroke();ctx.strokeStyle=border;ctx.globalAlpha=.45;for(let k=0;k<4;k++){const y=h-pad-k*(h-2*pad)/3;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke()}ctx.globalAlpha=1;series.forEach((ss,idx)=>{ctx.strokeStyle=idx===0?accent:accent2;ctx.lineWidth=2;ctx.beginPath();ss.vals.forEach((p,i)=>{const x=pad+(ss.vals.length===1?0:i*(w-2*pad)/(ss.vals.length-1)),y=h-pad-(p.y-min)/span*(h-2*pad);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});ctx.fillStyle=text;ctx.fillText(`${Math.round(max)}%`,6,18);ctx.fillText(`${Math.round(min)}%`,6,h-pad+4);ctx.fillText('100% baseline',w/2-30,h-8);const legend=$('#progressCompareLegend');if(legend)legend.innerHTML=series.map((ss,i)=>`<span><span class="dot" style="background:${i===0?accent:accent2}"></span>${esc(ss.ser.label)} function updateGymPR(ex,sets){const key=ex.id,unit=weightUnit(),maxWeight=Math.max(...sets.map(s=>s.weight)),best1rm=Math.max(...sets.map(s=>s.weight*(1+s.reps/30))),prs=state.gym.prs[key]||{name:ex.name,unit,repAtWeight:{}};prs.name=ex.name;prs.unit=unit;prs.heaviest=Math.max(prs.heaviest||0,maxWeight);prs.best1rm=Math.max(prs.best1rm||0,best1rm);sets.forEach(s=>{const old=prs.repAtWeight?.[s.weight]||0;if(s.reps>old)prs.repAtWeight=Object.assign({},prs.repAtWeight,{[s.weight]:s.reps})});state.gym.prs[key]=prs}
function showWarmup(weight){const unit=weightUnit(),rows=[{p:.4,r:10},{p:.6,r:6},{p:.8,r:3}].map(x=>`${Math.max(0,Math.round(weight*x.p*2)/2)} ${unit} × ~${x.r}`).join('<br>'),out=$('#warmupResult');if(out)out.innerHTML=`<div class="badge">Ramp</div><div style="margin-top:8px">${rows}</div>`;else toast(`Warm-up: ${rows.replaceAll('<br>','; ')}`)}

function photoCompareModal(data){const ex=state.cal.exercises.find(x=>x.id===data.id),photos=(ex?.plan||[]).filter(d=>d.log?.photoId).map(d=>({date:d.log.date,id:d.log.photoId})).sort((a,b)=>a.date.localeCompare(b.date));if(photos.length<2){toast('At least two stored photos are required.','info');return}state.__compare={exId:ex.id,photos,before:photos[0],after:photos.at(-1)};openPhotoCompare()}
async function loadCompareImages(){const c=state.__compare;if(!c)return;const b=$('#compareBeforeSelect')?.value||c.before.id,a=$('#compareAfterSelect')?.value||c.after.id;c.before=c.photos.find(p=>p.id===b)||c.before;c.after=c.photos.find(p=>p.id===a)||c.after;try{const [before,after]=await Promise.all([mediaGet(c.before.id),mediaGet(c.after.id)]);if(!before?.blob||!after?.blob){toast('One of the stored photos could not be read.','error');return}compareUrls.forEach(u=>URL.revokeObjectURL(u));compareUrls=[URL.createObjectURL(before.blob),URL.createObjectURL(after.blob)];const stage=$('#compareStage');if(stage){$('.compare-before',stage).src=compareUrls[0];$('.compare-after',stage).src=compareUrls[1];$('.compareBeforeLabel').textContent=prettyDate(c.before.date);$('.compareAfterLabel').textContent=prettyDate(c.after.date);const r=$('#compareRange');const v=Number(r?.value||50);$('#compareDivider').style.left=v+'%';$('.compare-after').style.clipPath=`inset(0 ${100-v}% 0 0)`}}catch{toast('Photo comparison could not read the selected media.','error')}}
