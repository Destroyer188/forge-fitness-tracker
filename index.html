async function initMedia(){if(mediaInitPromise)return mediaInitPromise;mediaInitPromise=(async()=>{const ok=await openMediaDB();if(!ok){mediaStatus='unavailable';toast('Progress-photo storage uses IndexedDB, but IndexedDB is unavailable here. Photo saving/comparison is disabled gracefully.','error');render();return}const migrated=await migrateLegacyMedia();if(migrated){state=loadActiveProfile();activeMode=state.ui.mode||'cal';calTab=state.ui.calTab||'dashboard';gymTab=state.ui.gymTab||'today';toast('Existing progress photos were moved to IndexedDB.','success')}render()})();return mediaInitPromise}

/* ===== Final correctness fixes ===== */
function clearMediaDB(){return openMediaDB().then(db=>{if(!db)return;return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})})}
function deleteProfileMedia(profileId){return openMediaDB().then(db=>{if(!db)return;return new Promise((resolve,reject)=>{const tx=db.transaction(MEDIA_STORE,'readwrite'),storeObj=tx.objectStore(MEDIA_STORE),req=storeObj.openCursor();req.onsuccess=()=>{const cur=req.result;if(!cur){resolve();return}if(cur.value.profileId===profileId)cur.delete();cur.continue()};req.onerror=()=>reject(req.error||new Error('Media cleanup failed'));tx.onerror=()=>reject(tx.error)})})}
async function deleteActiveProfile(){const ids=Object.keys(store.profiles);if(ids.length<=1){toast('Keep at least one profile on this device.','error');return}if(!confirm(`Delete ${state.profile?.name||'this profile'} and all of its data from this device?`))return;const deletedId=store.activeProfileId;delete store.profiles[deletedId];store.activeProfileId=Object.keys(store.profiles)[0];state=loadActiveProfile();activeMode=state.ui.mode||'cal';calTab=state.ui.calTab||'dashboard';gymTab=state.ui.gymTab||'today';try{await deleteProfileMedia(deletedId)}catch{toast('Profile data was deleted; some old media may remain in IndexedDB.','error')}persistStore();render();toast('Profile deleted','success')}
async function clearAll(){if(!confirm('Clear every Forge profile, training log, and stored progress photo from this browser?'))return;try{localStorage.removeItem(PROFILE_KEY);localStorage.removeItem(APP_KEY);await clearMediaDB()}catch{toast('Some stored media could not be cleared.','error')}location.reload()}
function gymUtilities(){const metric=weightUnit()==='kg';return `<div class="grid grid-2"><div class="card"><h2>Warm-up ramp</h2><div class="field"><label for="wuWeight">Target working weight (${weightUnit()})</label><input id="wuWeight" type="number" min="0" step="0.5" value="${metric?60:135}"></div><button class="btn primary" data-action="calcWarmup" style="margin-top:10px">Calculate</button><div id="warmupResult" style="margin-top:10px"></div></div><div class="card"><h2>Plate calculator</h2><div class="form-grid"><div class="field"><label for="plateTarget">Barbell target (${weightUnit()})</label><input id="plateTarget" type="number" min="0" step="0.5" value="${metric?100:220}"></div><div class="field"><label for="barWeight">Bar weight (${weightUnit()})</label><input id="barWeight" type="number" min="0" step="0.5" value="${metric?20:45}"></div><div class="field full"><label for="plateSizes">Plate sizes per plate (${weightUnit()}, comma-separated)</label><input id="plateSizes" value="${metric?'25,20,15,10,5,2.5,1.25':'45,35,25,10,5,2.5'}"></div></div><button class="btn primary" data-action="calcPlates" style="margin-top:10px">Calculate per side</button><div id="plateResult" style="margin-top:10px"></div></div></div><div class="card" style="margin-top:14px"><h2>Calendar export</h2><p class="overlay-info">Download the active weekly gym template as an all-day recurring .ics calendar file. Event timing is intentionally not invented; the export represents scheduled training days only.</p><button class="btn primary" data-action="exportICS">Download .ics</button></div>`}
function gymToday(){const tpl=getActiveTemplate(),dn=dayName(),plan=tpl.days[dn]||{isRestDay:true,label:'Rest',exercises:[]},logsForDate=state.gym.logs.filter(l=>l.date===localDate()),d=getDeloadStatus(),pending=state.gym.adjustments.filter(a=>a.status==='pending');if(plan.isRestDay)return `${backupReminderCard()}<div class="grid grid-2"><div class="card"><div class="section-head"><div><h2>Today • ${dn[0].toUpperCase()+dn.slice(1)}</h2><p>${prettyDate(localDate())} • Rest</p></div><span class="badge rest">REST DAY</span></div><div class="empty">Your active template marks today as a rest day.</div></div><div class="card"><h2>Week status</h2>${d.suggested&&!d.active?'<div class="overlay-info">Recent volume/RIR trends suggest a deload.</div><button class="btn small primary" data-action="startDeload" style="margin-top:8px">Start deload</button>':''}${d.active?'<div class="danger-box"><strong>DELOAD WEEK '+infoTip(deloadRationale(),'Why deload?')+'</strong><div class="small muted">Reduced gym suggestions are active.</div><button class="btn small" data-action="endDeload" style="margin-top:8px">End deload</button></div>':''}</div></div>${proactiveInsightCard()}${renderActivityHeatmap()}`;const groups=[],seenIds=new Set(),seenSupersets=new Set();for(const e of plan.exercises||[]){if(seenIds.has(e.id))continue;if(e.supersetGroup&&!seenSupersets.has(e.supersetGroup)){const members=(plan.exercises||[]).filter(x=>x.supersetGroup===e.supersetGroup),pair=members.slice(0,2);pair.forEach(x=>seenIds.add(x.id));seenSupersets.add(e.supersetGroup);groups.push(`<div class="superset"><div class="small muted" style="margin-bottom:7px">Superset ${esc(e.supersetGroup)} • alternate exercises</div><div class="superset-grid">${pair.map(x=>renderGymLogCard(x,logsForDate.find(l=>l.exerciseId===x.id))).join('')}</div>${members.length>2?`<div class="small muted" style="margin-top:7px">Only the first two exercises in this group are paired; the rest remain regular blocks.</div>`:''}</div>`);members.slice(2).forEach(x=>{seenIds.add(x.id);groups.push(renderGymLogCard(x,logsForDate.find(l=>l.exerciseId===x.id)))})}else if(!e.supersetGroup){seenIds.add(e.id);groups.push(renderGymLogCard(e,logsForDate.find(l=>l.exerciseId===e.id)))}}return `${backupReminderCard()}<div class="grid grid-2"><div class="card"><div class="section-head"><div><h2>Today • ${dn[0].toUpperCase()+dn.slice(1)}</h2><p>${prettyDate(localDate())} • ${esc(plan.label||'')}</p></div><span class="badge phase">TRAINING DAY</span></div>${d.active?'<div class="danger-box" style="margin-bottom:10px"><strong>DELOAD WEEK</strong><div class="small muted">Suggested sets and load are reduced.</div></div>':d.suggested?'<div class="overlay-info" style="margin-bottom:10px">Deload suggested '+infoTip(deloadRationale(),'Why deload?')+' from the recent 28-day volume/RIR trend. <button class="btn small" data-action="startDeload" style="margin-left:6px">Start</button></div>':''}<div class="gym-list">${groups.join('')}</div></div><div class="card"><h2>Session summary</h2><div class="grid grid-2"><div class="stat"><div class="num">${logsForDate.length}</div><div class="label">Exercises logged</div></div><div class="stat"><div class="num">${logsForDate.reduce((n,l)=>n+l.setsLogged.length,0)}</div><div class="label">Sets logged</div></div><div class="stat"><div class="num">${weeklyVolume().sets}</div><div class="label">Week sets</div></div><div class="stat"><div class="num">${Object.keys(state.gym.prs||{}).length}</div><div class="label">PR exercises</div></div></div>${renderGymSuggestions()}${pending.length ? `<div style="margin-top:10px"><strong>Transparent autoregulation</strong>${pending.slice(-3).map(a => `<div class="overlay-info" style="margin-top:7px">${esc(a.reason)} <div class="inline" style="margin-top:5px"><button class="btn small primary" data-action="applyGymAdjustment" data-id="${a.id}">Apply</button><button class="btn small" data-action="dismissGymAdjustment" data-id="${a.id}">Dismiss</button></div></div>`).join('')}</div>` : ''}</div></div>${sessionCheckinCard('gym',localDate())}${proactiveInsightCard()}${renderActivityHeatmap()}`}
function downloadGymICS(){const tpl=getActiveTemplate();if(!tpl){toast('No active gym template to export.','error');return}const now=new Date(),todayIdx=(now.getDay()+6)%7,training=DAYS.map((d,i)=>({d,i})).filter(x=>!tpl.days[x.d]?.isRestDay);if(!training.length){toast('The active template has no training days to export.','error');return}const first=training.find(x=>x.i>=todayIdx)||training[0],offset=(first.i-todayIdx+7)%7,base=new Date(now.getFullYear(),now.getMonth(),now.getDate()+offset),stamp=`${base.getFullYear()}${String(base.getMonth()+1).padStart(2,'0')}${String(base.getDate()).padStart(2,'0')}`,end=new Date(base.getFullYear(),base.getMonth(),base.getDate()+1),endStamp=`${end.getFullYear()}${String(end.getMonth()+1).padStart(2,'0')}${String(end.getDate()).padStart(2,'0')}`,by=training.map(x=>x.d.slice(0,2).toUpperCase()).join(',');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Forge Fitness//Workout Template//EN','CALSCALE:GREGORIAN','X-WR-CALNAME:'+icsEsc(tpl.name),'BEGIN:VEVENT','UID:'+uid('ics')+'@forge','DTSTAMP:'+stamp+'T000000Z','DTSTART;VALUE=DATE:'+stamp,'DTEND;VALUE=DATE:'+endStamp,'RRULE:FREQ=WEEKLY;BYDAY='+by,'SUMMARY:'+icsEsc(tpl.name),'DESCRIPTION:'+icsEsc('Forge weekly training template: '+tpl.name),'END:VEVENT','END:VCALENDAR'];const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`forge-${tpl.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Calendar .ics downloaded.','success')}

function applyLaunchShortcut(search=location.search){try{const shortcut=new URLSearchParams(search).get('shortcut');if(shortcut==='today'){activeMode='gym';gymTab='today';state.ui.mode='gym';state.ui.gymTab='today'}else if(shortcut==='coach'){activeMode='cal';calTab='coach';state.ui.mode='cal';state.ui.calTab='coach'}else return;saveState();history.replaceState({},document.title,location.pathname)}catch{}}
function setupManifest(){const manifest={name:'Forge Fitness Tracker',short_name:'Forge',start_url:'./',scope:'./',display:'standalone',theme_color:'#0c1118',background_color:'#0b1016',description:'Offline fitness planner and tracker',shortcuts:[{name:"Log today's workout",short_name:'Today',description:"Open today's workout log",url:'?shortcut=today'},{name:'Open Coach',short_name:'Coach',description:'Open the Forge Coach',url:'?shortcut=coach'}]};try{$('#manifestLink').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(manifest))}catch{}}
function setupGlobal(){
  $('#timerPause').addEventListener('click',()=>timer.running?pauseTimer():resumeTimer());$('#timerReset').addEventListener('click',resetTimer);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalBackdrop').classList.contains('open')){closeModal();return}if(e.key==='?'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){openHelp()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveState('Saved locally')}});
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(state.ui.theme==='system')render()});
}
function openHelp(){if($('#modalBackdrop').classList.contains('open'))return;const bd=$('#modalBackdrop');bd.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${modalTitle('Keyboard help')}<div class="help-grid"><div class="card"><span class="kbd">?</span><div class="small muted" style="margin-top:6px">Open this help</div></div><div class="card"><span class="kbd">Esc</span><div class="small muted" style="margin-top:6px">Close modal</div></div><div class="card"><span class="kbd">Tab</span><div class="small muted" style="margin-top:6px">Move through controls</div></div><div class="card"><span class="kbd">Ctrl/Cmd + S</span><div class="small muted" style="margin-top:6px">Save current state locally</div></div></div><div class="modal-footer"><button class="btn primary" data-close-modal>Close</button></div></div>`;bd.classList.add('open');bd.setAttribute('aria-hidden','false');activeModal='help';resetModalBindings()}
function initAfterRender(){bindSettingsExtras();bindCoach();if($('#measureChart'))populateMeasureChart();if($('#sessionTrendChart'))populateSessionTrendChart();if($('#progressCompareChart'))bindProgressComparison();}
const origRender=render;render=function(){origRender();initAfterRender();}
applyLaunchShortcut();setupManifest();setupGlobal();render();setTimeout(initMedia,0);setInterval(checkWorkoutReminders,60000);setTimeout(checkWorkoutReminders,1200);
</script>
</body>
